<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #FFFFFF;
    --section: #F4F4F4;
    --accent: #0098CC;
    --accent-glow: rgba(0,152,204,0.1);
    --text: #0A0A0A;
    --subtext: #666666;
    --border: rgba(0,0,0,0.09);
    --card: #EBEBEB;
  }

  html { scroll-behavior: smooth; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Barlow', sans-serif;
    font-weight: 400;
    line-height: 1.6;
    overflow-x: hidden;
  }

  /* ── NAV ── */
  nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    padding: 0 5vw;
    height: 130px;
    display: flex; align-items: center; justify-content: space-between;
    background: rgba(255,255,255,0.92);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
  }
  .nav-logo {
    display: flex; align-items: center; gap: 12px;
    text-decoration: none;
  }
  .nav-logo img {
    height: 120px;
    width: auto;
    display: block;
  }
  .nav-logo-text {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 900; font-size: 28px;
    letter-spacing: 3px; text-transform: uppercase;
    color: var(--text); line-height: 1;
  }
  .nav-logo-text span { color: var(--accent); }
  .nav-logo-text {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 900; font-size: 28px;
    letter-spacing: 3px; text-transform: uppercase;
    color: var(--text); line-height: 1;
  }
  .nav-logo-text span { color: var(--accent); }
  .nav-links { display: flex; gap: 36px; list-style: none; }
  .nav-links a {
    color: var(--subtext); text-decoration: none;
    font-size: 13px; font-weight: 500;
    letter-spacing: 1.5px; text-transform: uppercase;
    transition: color 0.2s;
  }
  .nav-links a:hover { color: var(--accent); }
  .nav-cta {
    background: var(--accent);
    color: #FFF !important;
    padding: 8px 20px;
    font-weight: 700 !important;
    letter-spacing: 1px;
    transition: background 0.2s !important;
  }
  .nav-cta:hover { background: #0080AA !important; color: #FFF !important; }
  .hamburger { display: none; flex-direction: column; gap: 5px; cursor: pointer; }
  .hamburger span { display: block; width: 24px; height: 2px; background: var(--text); transition: 0.3s; }
  .mobile-menu {
    display: none; position: fixed; top: 64px; left: 0; right: 0;
    background: rgba(255,255,255,0.98); padding: 24px 5vw;
    flex-direction: column; gap: 20px; z-index: 99;
    border-bottom: 1px solid var(--border);
  }
  .mobile-menu a {
    color: var(--subtext); text-decoration: none;
    font-size: 15px; font-weight: 500; letter-spacing: 1px;
    text-transform: uppercase;
  }
  .mobile-menu a:hover { color: var(--accent); }
  .mobile-menu.open { display: flex; }

  /* ── HERO ── */
  #hero {
    min-height: 100vh;
    display: flex; align-items: center;
    padding: 100px 5vw 60px;
    position: relative; overflow: hidden;
    background: linear-gradient(135deg, #FFFFFF 0%, #EEF7FB 50%, #FFFFFF 100%);
  }
  .hero-grid-bg {
    position: absolute; inset: 0; pointer-events: none;
    background-image:
      linear-gradient(rgba(0,152,204,0.07) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,152,204,0.07) 1px, transparent 1px);
    background-size: 60px 60px;
  }
  .hero-glow {
    position: absolute; top: -200px; right: -200px;
    width: 700px; height: 700px;
    background: radial-gradient(circle, rgba(0,152,204,0.1) 0%, transparent 70%);
    pointer-events: none;
  }
  .hero-content { position: relative; z-index: 2; max-width: 800px; }
  .hero-eyebrow {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 13px; font-weight: 600;
    letter-spacing: 4px; text-transform: uppercase;
    color: var(--accent); margin-bottom: 20px;
    opacity: 0; animation: fadeUp 0.6s 0.2s forwards;
  }
  .hero-title {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: clamp(60px, 10vw, 120px);
    font-weight: 900; line-height: 0.9;
    text-transform: uppercase; letter-spacing: -1px;
    margin-bottom: 30px; color: var(--text);
    opacity: 0; animation: fadeUp 0.7s 0.4s forwards;
  }
  .hero-title .line2 { color: var(--accent); }
  .hero-sub {
    font-size: 18px; font-weight: 300;
    color: var(--subtext); max-width: 500px;
    margin-bottom: 48px; line-height: 1.7;
    opacity: 0; animation: fadeUp 0.7s 0.6s forwards;
  }
  .hero-btns {
    display: flex; gap: 16px; flex-wrap: wrap;
    opacity: 0; animation: fadeUp 0.7s 0.8s forwards;
  }
  .btn-primary {
    background: var(--accent); color: #FFF;
    padding: 14px 36px; font-family: 'Barlow Condensed', sans-serif;
    font-size: 16px; font-weight: 700; letter-spacing: 2px;
    text-transform: uppercase; text-decoration: none;
    border: none; cursor: pointer;
    transition: background 0.2s, transform 0.15s;
    display: inline-block;
  }
  .btn-primary:hover { background: #0080AA; transform: translateY(-2px); }
  .btn-outline {
    background: transparent; color: var(--text);
    padding: 14px 36px; font-family: 'Barlow Condensed', sans-serif;
    font-size: 16px; font-weight: 700; letter-spacing: 2px;
    text-transform: uppercase; text-decoration: none;
    border: 1px solid rgba(0,0,0,0.25); cursor: pointer;
    transition: border-color 0.2s, color 0.2s, transform 0.15s;
    display: inline-block;
  }
  .btn-outline:hover { border-color: var(--accent); color: var(--accent); transform: translateY(-2px); }

  .hero-stats {
    display: flex; gap: 48px; flex-wrap: wrap;
    margin-top: 72px; padding-top: 48px;
    border-top: 1px solid var(--border);
    opacity: 0; animation: fadeUp 0.7s 1s forwards;
  }
  .hero-stat-num {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 48px; font-weight: 900; line-height: 1;
    color: var(--accent);
  }
  .hero-stat-label {
    font-size: 12px; font-weight: 500; letter-spacing: 2px;
    text-transform: uppercase; color: var(--subtext);
    margin-top: 4px;
  }

  /* ── SECTION DEFAULTS ── */
  section { padding: 100px 5vw; }
  .section-label {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 12px; font-weight: 700;
    letter-spacing: 4px; text-transform: uppercase;
    color: var(--accent); margin-bottom: 16px;
  }
  .section-title {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: clamp(36px, 5vw, 60px);
    font-weight: 900; text-transform: uppercase;
    line-height: 1; margin-bottom: 24px; color: var(--text);
  }
  .section-sub {
    font-size: 17px; color: var(--subtext);
    max-width: 560px; line-height: 1.7;
  }

  /* ── TICKER ── */
  .ticker-wrap {
    background: var(--accent); overflow: hidden;
    padding: 14px 0; white-space: nowrap;
  }
  .ticker-inner {
    display: inline-block;
    animation: ticker 20s linear infinite;
  }
  .ticker-inner span {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 15px; font-weight: 700;
    letter-spacing: 3px; text-transform: uppercase;
    color: #FFF; margin: 0 40px;
  }
  .ticker-inner span::before { content: '✦ '; }

  /* ── ABOUT ── */
  #about { background: var(--section); }
  .about-grid {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 80px; align-items: start; margin-top: 60px;
  }
  .about-text p {
    color: var(--subtext); font-size: 16px;
    line-height: 1.8; margin-bottom: 20px;
  }
  .about-text strong { color: var(--text); }
  .mission-block {
    border-left: 3px solid var(--accent);
    padding: 20px 24px; background: #fff;
    margin: 32px 0;
  }
  .mission-block p { color: var(--text); font-size: 16px; line-height: 1.7; margin: 0; }
  .community-list { list-style: none; margin-top: 24px; }
  .community-list li {
    display: flex; align-items: center; gap: 14px;
    padding: 14px 0; border-bottom: 1px solid var(--border);
    font-size: 16px; color: var(--subtext);
  }
  .community-list li::before {
    content: '';
    width: 8px; height: 8px; flex-shrink: 0;
    background: var(--accent);
  }
  .founder-card {
    background: #fff; padding: 40px;
    position: relative; overflow: hidden;
    border: 1px solid var(--border);
  }
  .founder-card::before {
    content: '';
    position: absolute; top: 0; left: 0; right: 0;
    height: 3px; background: var(--accent);
  }
  .founder-name {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 32px; font-weight: 900; text-transform: uppercase;
    margin-bottom: 4px; color: var(--text);
  }
  .founder-role {
    font-size: 12px; font-weight: 600; letter-spacing: 3px;
    text-transform: uppercase; color: var(--accent); margin-bottom: 24px;
  }
  .founder-bio { color: var(--subtext); font-size: 15px; line-height: 1.8; margin-bottom: 20px; }
  .philosophy-quote {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 20px; font-weight: 700;
    color: var(--accent); line-height: 1.4;
    border-left: 3px solid var(--accent);
    padding-left: 20px; margin-top: 24px; font-style: italic;
  }

  /* ── SERVICES ── */
  #services { background: var(--bg); }
  .services-tabs {
    display: flex; gap: 0; margin: 48px 0 0;
    border-bottom: 1px solid var(--border); flex-wrap: wrap;
  }
  .tab-btn {
    background: none; border: none; cursor: pointer;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 14px; font-weight: 700;
    letter-spacing: 2px; text-transform: uppercase;
    color: var(--subtext); padding: 14px 24px;
    border-bottom: 3px solid transparent;
    transition: color 0.2s, border-color 0.2s; margin-bottom: -1px;
  }
  .tab-btn:hover { color: var(--text); }
  .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }
  .tab-content { display: none; padding: 40px 0; animation: fadeUp 0.4s forwards; }
  .tab-content.active { display: block; }
  .service-intro {
    font-size: 17px; color: var(--subtext); max-width: 600px;
    line-height: 1.7; margin-bottom: 40px;
  }
  .service-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 16px;
  }
  .service-item {
    background: var(--card); padding: 24px;
    border: 1px solid var(--border);
    transition: border-color 0.2s, transform 0.2s;
  }
  .service-item:hover { border-color: var(--accent); transform: translateY(-3px); }
  .service-num {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 42px; font-weight: 900; line-height: 1;
    color: rgba(0,152,204,0.2); margin-bottom: 12px;
  }
  .service-name {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 18px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 1px;
    color: var(--text);
  }

  /* ── TRAINERS ── */
  #trainers { background: var(--section); }
  .trainers-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 24px; margin-top: 60px;
  }
  .trainer-card {
    background: #fff; padding: 32px;
    border: 1px solid var(--border);
    position: relative; overflow: hidden;
    transition: border-color 0.2s, transform 0.2s;
  }
  .trainer-card:hover { border-color: var(--accent); transform: translateY(-4px); }
  .trainer-avatar {
    width: 64px; height: 64px;
    background: rgba(0,152,204,0.1);
    border: 2px solid var(--accent);
    display: flex; align-items: center; justify-content: center;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 22px; font-weight: 900;
    color: var(--accent); margin-bottom: 20px;
  }
  .trainer-badge {
    position: absolute; top: 0; right: 0;
    background: var(--accent); color: #FFF;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 11px; font-weight: 700; letter-spacing: 2px;
    text-transform: uppercase; padding: 6px 14px;
  }
  .trainer-name {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 26px; font-weight: 900;
    text-transform: uppercase; margin-bottom: 6px; color: var(--text);
  }
  .trainer-exp {
    font-size: 12px; font-weight: 600; letter-spacing: 2px;
    text-transform: uppercase; color: var(--accent); margin-bottom: 16px;
  }
  .trainer-tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag {
    font-size: 11px; font-weight: 600; letter-spacing: 1px;
    text-transform: uppercase; padding: 5px 10px;
    background: var(--section);
    border: 1px solid var(--border); color: var(--subtext);
  }

  /* ── PRINCIPLES ── */
  #principles { background: var(--bg); }
  .principles-grid {
    display: grid; grid-template-columns: repeat(7, 1fr);
    gap: 8px; margin-top: 60px;
  }
  .principle-item {
    background: var(--card); padding: 32px 16px; text-align: center;
    border: 1px solid var(--border);
    transition: background 0.3s, border-color 0.3s; cursor: default;
  }
  .principle-item:hover { background: rgba(0,152,204,0.07); border-color: var(--accent); }
  .principle-num {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 48px; font-weight: 900;
    color: var(--accent); line-height: 1; margin-bottom: 12px;
  }
  .principle-name {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 15px; font-weight: 800;
    text-transform: uppercase; letter-spacing: 1px; color: var(--text);
  }

  /* ── CONTACT ── */
  #contact { background: var(--section); }
  .contact-grid {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 40px; margin-top: 60px;
  }
  .contact-card {
    background: #fff; padding: 40px;
    border: 1px solid var(--border);
    position: relative; overflow: hidden;
  }
  .contact-card::before {
    content: '';
    position: absolute; top: 0; left: 0;
    width: 4px; height: 100%; background: var(--accent);
  }
  .contact-location {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 14px; font-weight: 700; letter-spacing: 3px;
    text-transform: uppercase; color: var(--accent); margin-bottom: 16px;
  }
  .contact-branch {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 26px; font-weight: 900; text-transform: uppercase;
    margin-bottom: 24px; line-height: 1.1; color: var(--text);
  }
  .contact-rows { display: flex; flex-direction: column; gap: 14px; }
  .contact-row { display: flex; gap: 14px; align-items: flex-start; }
  .contact-icon {
    width: 16px; height: 16px; flex-shrink: 0;
    color: var(--accent); margin-top: 2px;
  }
  .contact-detail { font-size: 14px; color: var(--subtext); line-height: 1.5; }
  .contact-detail a { color: var(--accent); text-decoration: none; }
  .hours-chip {
    display: inline-block; margin-top: 20px;
    background: rgba(0,152,204,0.08);
    border: 1px solid rgba(0,152,204,0.25);
    padding: 8px 16px;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 14px; font-weight: 700; letter-spacing: 2px;
    text-transform: uppercase; color: var(--accent);
  }
  .contact-cta {
    margin-top: 60px; padding: 48px;
    background: linear-gradient(135deg, rgba(0,152,204,0.07) 0%, rgba(0,152,204,0.02) 100%);
    border: 1px solid rgba(0,152,204,0.2);
    text-align: center;
  }
  .contact-cta h3 {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 36px; font-weight: 900; text-transform: uppercase;
    margin-bottom: 16px; color: var(--text);
  }
  .contact-cta p { color: var(--subtext); margin-bottom: 28px; font-size: 16px; }
  .cta-btns { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; }

  /* ── FOOTER ── */
  footer {
    background: #ECECEC;
    padding: 60px 5vw 32px;
    border-top: 1px solid var(--border);
  }
  .footer-top {
    display: flex; justify-content: space-between;
    align-items: flex-start; flex-wrap: wrap; gap: 40px;
    margin-bottom: 48px;
  }
  .footer-brand .logo {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 28px; font-weight: 900; letter-spacing: 2px;
    text-transform: uppercase; color: var(--text);
    display: block; margin-bottom: 8px;
  }
  .footer-brand .logo span { color: var(--accent); }
  .footer-brand p { font-size: 14px; color: var(--subtext); max-width: 260px; line-height: 1.6; }
  .footer-taglines { text-align: right; }
  .footer-taglines p {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 18px; font-weight: 700; letter-spacing: 2px;
    text-transform: uppercase; color: var(--subtext); line-height: 1.6;
  }
  .footer-taglines p span { color: var(--accent); }
  .footer-bottom {
    border-top: 1px solid var(--border);
    padding-top: 24px;
    display: flex; justify-content: space-between; align-items: center;
    flex-wrap: wrap; gap: 12px;
  }
  .footer-bottom p { font-size: 13px; color: rgba(0,0,0,0.35); }

  /* ── ANIMATIONS ── */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(24px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes ticker {
    from { transform: translateX(0); }
    to { transform: translateX(-50%); }
  }
  .reveal {
    opacity: 0; transform: translateY(30px);
    transition: opacity 0.6s ease, transform 0.6s ease;
  }
  .reveal.visible { opacity: 1; transform: translateY(0); }

  /* ── RESPONSIVE ── */
  @media (max-width: 900px) {
    .nav-links { display: none; }
    .nav-cta-desk { display: none; }
    .hamburger { display: flex; }
    .about-grid { grid-template-columns: 1fr; gap: 48px; }
    .contact-grid { grid-template-columns: 1fr; }
    .principles-grid { grid-template-columns: repeat(4, 1fr); }
    .hero-stats { gap: 28px; }
  }
  @media (max-width: 600px) {
    .principles-grid { grid-template-columns: repeat(2, 1fr); }
    .hero-title { font-size: 56px; }
    section { padding: 72px 5vw; }
    .hero-stats { gap: 24px; }
    .hero-stat-num { font-size: 36px; }
  }
</style>
</head>
<body>
<nav>
  <a href="index.html" class="nav-logo">
      <img src="images/logo.png" alt="SQUAD7 Fitness Logo">
  </a>
  <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="services.html">Services</a></li>
      <li><a href="gallery.html">Gallery</a></li>
      <li><a href="contact.html" class="nav-cta">Contact</a></li>
  </ul>
  <div class="hamburger">
      <span></span><span></span><span></span>
  </div>
</nav>

<section id='services'><div class='section-label'>Services</div><h1 class='section-title'>Our Services</h1><p class='section-sub'>Move the Services section from the original file here.</p></section>
</body></html>
